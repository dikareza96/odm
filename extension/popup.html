<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 13px "Segoe UI", system-ui, sans-serif; width: 240px; margin: 0; padding: 12px; background: #171a23; color: #e6e8ef; }
  h1 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4f8cff; }
  label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  button { width: 100%; background: #2b3242; color: #cfd6e6; border: 1px solid #333a4d; border-radius: 8px; padding: 7px; cursor: pointer; }
  .status { color: #8b93a7; margin-top: 8px; font-size: 12px; }
</style>
</head>
<body>
  <h1><span class="dot"></span> ODM Integration</h1>
  <label><input id="enabled" type="checkbox" /> Take over downloads</label>
  <button id="test">Test connection</button>
  <div class="status" id="status">—</div>
  <script src="popup.js"></script>
</body>
</html>
