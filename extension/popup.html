<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --card: #f6f8fa;
    --accent: #0969da; --ok: #1a7f37; --err: #cf222e;
    --odm-fg: var(--fg); --odm-muted: var(--muted); --odm-hover: rgba(9, 105, 218, .08);
    --odm-icon-bg: #eaeef2; --odm-accent: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b22; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --card: #0d1117;
      --accent: #58a6ff; --ok: #3fb950; --err: #f85149;
      --odm-hover: rgba(56, 139, 253, .15); --odm-icon-bg: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--accent); color: #fff; }
  .logo svg { width: 15px; height: 15px; }
  header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 650; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
  section { padding: 10px 14px; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); cursor: pointer; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  h2 { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    display: flex; justify-content: space-between; }
  #media { display: flex; flex-direction: column; gap: 2px; max-height: 300px; overflow-y: auto; margin: 0 -6px; }
  .empty { color: var(--muted); padding: 14px 6px; text-align: center; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 14px; border-top: 1px solid var(--line); background: var(--card); }
  #status { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  #test { flex: none; font: inherit; font-size: 12px; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #test:hover { border-color: var(--muted); }
</style>
</head>
<body>
  <header>
    <span class="logo" id="logo"></span>
    <h1>ODM</h1>
    <span class="dot" id="dot" title="Connection to ODM"></span>
  </header>
  <section class="setting">
    <label for="enabled">Take over browser downloads</label>
    <label class="switch"><input id="enabled" type="checkbox" /><span></span></label>
  </section>
  <section>
    <h2><span>Media on this page</span><span id="count"></span></h2>
    <div id="media"><div class="empty">Nothing yet. Start playing the video.</div></div>
  </section>
  <footer>
    <span id="status">—</span>
    <button id="test" type="button">Test connection</button>
  </footer>
  <script src="medialist.js"></script>
  <script src="popup.js"></script>
</body>
</html>
