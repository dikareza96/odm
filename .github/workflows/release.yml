name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
            goos: linux
            goarch: amd64
            name: odm
          - os: macos-latest
            label: darwin-arm64
            goos: darwin
            goarch: arm64
            name: odm
          - os: windows-latest
            label: windows-amd64
            goos: windows
            goarch: amd64
            name: ODM.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable # macos-latest (macOS 26) failed to link with Go 1.23
          cache: true

      - name: Install Linux GL/X11 deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress -y

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X odm/internal/version.Version=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=${{ matrix.goarch }} \
              go build -tags fyne -trimpath -ldflags "${LDFLAGS} -H=windowsgui" \
              -o "dist/${{ matrix.name }}" ./cmd/odm
          else
            CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -tags fyne -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/${{ matrix.name }}" ./cmd/odm
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p stage
          cp "dist/${{ matrix.name }}" stage/
          cp README.md LICENSE stage/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd stage && zip -r "../odm-${{ matrix.label }}.zip" .)
          else
            tar -czf "odm-${{ matrix.label }}.tar.gz" -C stage .
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: odm-${{ matrix.label }}.*
          generate_release_notes: true
          # Tags like v0.1.0-rc1 publish as pre-releases, which the in-app
          # update check (releases/latest) does not offer.
          prerelease: ${{ contains(github.ref_name, '-') }}
